name: Integration (GenLayer)

on:
  workflow_dispatch:
    inputs:
      live_evaluation:
        description: Also run the real web + LLM evaluation
        type: boolean
        default: false
  # Marker runs execute on Studionet: hosted, gasless, real wallets and real
  # consensus. Edit .github/integration-request to trigger one.
  push:
    paths:
      - .github/integration-request

permissions:
  contents: read

concurrency:
  group: integration-studionet
  cancel-in-progress: false

jobs:
  integration:
    name: Integration (studionet)
    runs-on: ubuntu-latest
    env:
      NETWORK: studionet
      KEYSTORE_1: ${{ secrets.KEYSTORE_1 }}
      KEYSTORE_PASSWORD_1: ${{ secrets.KEYSTORE_PASSWORD_1 }}
      KEYSTORE_2: ${{ secrets.KEYSTORE_2 }}
      KEYSTORE_PASSWORD_2: ${{ secrets.KEYSTORE_PASSWORD_2 }}
      ACCOUNT_PRIVATE_KEY_1: ${{ secrets.ACCOUNT_PRIVATE_KEY_1 }}
      ACCOUNT_PRIVATE_KEY_2: ${{ secrets.ACCOUNT_PRIVATE_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve options
        run: |
          live=0
          if [ "${{ inputs.live_evaluation }}" = "true" ]; then
            live=1
          fi
          if [ "${{ github.event_name }}" = "push" ] && grep -q "live-evaluation" .github/integration-request; then
            live=1
          fi
          echo "SPECPROOF_LIVE_EVALUATION=$live" >> "$GITHUB_ENV"
          echo "live evaluation: $live"
      - name: Install GenLayer tooling
        run: pip install -r requirements.txt
      - name: Run integration tests
        run: gltest tests/integration -v --network "$NETWORK"
