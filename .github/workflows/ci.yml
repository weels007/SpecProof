name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-lint:
    name: Contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GenLayer tooling
        run: pip install -r requirements.txt
      - name: Lint Intelligent Contracts
        run: |
          set -euo pipefail
          shopt -s nullglob
          contracts=(contracts/*.py)
          if [ ${#contracts[@]} -eq 0 ]; then
            echo "No contracts found in contracts/"
            exit 1
          fi
          for contract in "${contracts[@]}"; do
            echo "Linting $contract"
            genvm-lint check "$contract"
          done

  contract-test:
    name: Contract direct-mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install GenLayer tooling
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q contracts tests
      - name: Run direct-mode tests
        run: pytest tests/direct -v

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
