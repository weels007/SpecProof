# Funded integration configuration for Bradbury testnet.
#
# `gltest` only reads `gltest.config.yaml`, so this file is opt-in:
#
#     cp gltest.testnet.yaml gltest.config.yaml
#     gltest tests/integration -v --network testnet_bradbury
#
# Fill `.env` from `.env.example` first (never commit it), and restore the
# default config afterwards with `git restore gltest.config.yaml`.
networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"

  studionet: {}

  testnet_bradbury:
    accounts:
      - "${ACCOUNT_PRIVATE_KEY_1}"
    from: "${ACCOUNT_PRIVATE_KEY_1}"

paths:
  contracts: "contracts"

environment: .env
